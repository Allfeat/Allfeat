[workspace]
resolver = "2"
members = ["runtime/melodie"]

[workspace.package]
authors = ["Allfeat Foundation <hello@allfeat.org>"]
edition = "2024"
homepage = "https://allfeat.org"
license = "GPL-3.0"
repository = "https://github.com/allfeat/allfeat"
version = "1.0.0-dev"

[workspace.dependencies]
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive"] }
docify = "0.4.1"
log = { version = "0.4.25", default-features = false }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.137", features = ["alloc"], default-features = false }
smallvec = "1.13.2"
cumulus-pallet-parachain-system = { version = "0.26.0", default-features = false }

# Allfeat SDK pallets (`feat/umbrella` branches; the lockfile pins the revisions).
pallet-ats = { git = "https://github.com/Allfeat/ats-sdk.git", branch = "feat/umbrella", default-features = false }
pallet-midds = { git = "https://github.com/Allfeat/midds-sdk.git", branch = "feat/umbrella", default-features = false }
midds-types = { git = "https://github.com/Allfeat/midds-sdk.git", branch = "feat/umbrella", default-features = false }
midds-traits = { git = "https://github.com/Allfeat/midds-sdk.git", branch = "feat/umbrella", default-features = false }
midds-runtime-api = { git = "https://github.com/Allfeat/midds-sdk.git", branch = "feat/umbrella", default-features = false }

# Build
substrate-wasm-builder = "32.0.0"

polkadot-sdk = { version = "2603.0.0", default-features = false }

[profile.release]
panic = "unwind"

# On-chain release profile (just build-melodie, weight scripts, srtool).
[profile.production]
codegen-units = 1
inherits = "release"
lto = "fat"
strip = true

# To develop against the local sibling SDK checkouts, uncomment:
# [patch."https://github.com/Allfeat/ats-sdk.git"]
# pallet-ats = { path = "../ats-sdk/pallet-ats" }
#
# [patch."https://github.com/Allfeat/midds-sdk.git"]
# pallet-midds = { path = "../midds-sdk/pallets/pallet-midds" }
# midds-types = { path = "../midds-sdk/crates/midds-types" }
# midds-traits = { path = "../midds-sdk/crates/midds-traits" }
# midds-runtime-api = { path = "../midds-sdk/crates/midds-runtime-api" }
