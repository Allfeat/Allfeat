# Tag-driven deterministic runtime releases.
#
#   melodie-v3-<spec_version>  → runtime/melodie  (melodie-runtime)
#   allfeat-v<spec_version>    → runtime/mainnet  (allfeat-runtime)
#
# srtool builds the wasm deterministically, subwasm cross-checks that the
# spec_version embedded in the wasm matches the tag, provenance is attested,
# and the release is created as a DRAFT: a human reviews the notes (and, at
# cutover time, attaches the stable chain specs) before publishing.
name: Runtime Release

on:
  push:
    tags:
      - "melodie-v3-*"
      - "allfeat-v*"

permissions:
  contents: read

env:
  SUBWASM_VERSION: "0.21.3"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      runtime_name: ${{ steps.extract.outputs.runtime_name }}
      runtime_dir: ${{ steps.extract.outputs.runtime_dir }}
      spec_version: ${{ steps.extract.outputs.spec_version }}
    steps:
      - name: Extract runtime metadata
        id: extract
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # Supported tag formats:
          #   melodie-v3-<spec_version>
          #   allfeat-v<spec_version>
          if [[ "${TAG}" =~ ^melodie-v3-([0-9]+)$ ]]; then
            RUNTIME_NAME="melodie"
            SPEC_VERSION="${BASH_REMATCH[1]}"
            RUNTIME_DIR="runtime/melodie"
          elif [[ "${TAG}" =~ ^allfeat-v([0-9]+)$ ]]; then
            RUNTIME_NAME="allfeat"
            SPEC_VERSION="${BASH_REMATCH[1]}"
            RUNTIME_DIR="runtime/mainnet"
          else
            echo "Unsupported tag format: ${TAG}" >&2
            echo "Expected: melodie-v3-<spec_version> or allfeat-v<spec_version>" >&2
            exit 1
          fi

          echo "Runtime: ${RUNTIME_NAME}"
          echo "Spec version: ${SPEC_VERSION}"
          echo "Runtime dir: ${RUNTIME_DIR}"

          echo "runtime_name=${RUNTIME_NAME}" >> "${GITHUB_OUTPUT}"
          echo "runtime_dir=${RUNTIME_DIR}" >> "${GITHUB_OUTPUT}"
          echo "spec_version=${SPEC_VERSION}" >> "${GITHUB_OUTPUT}"

  build-runtime:
    needs: prepare
    uses: ./.github/workflows/release-build-srtool-runtime.yml
    with:
      runtime_name: ${{ needs.prepare.outputs.runtime_name }}
      runtime_dir: ${{ needs.prepare.outputs.runtime_dir }}

  publish:
    needs:
      - prepare
      - build-runtime
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RUNTIME_NAME: ${{ needs.prepare.outputs.runtime_name }}
      SPEC_VERSION: ${{ needs.prepare.outputs.spec_version }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Download runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RUNTIME_NAME }}-runtime
          path: dist

      - name: Install subwasm
        run: |
          set -euo pipefail
          curl -fsSL -o subwasm.deb \
            "https://github.com/chevdor/subwasm/releases/download/v${SUBWASM_VERSION}/subwasm_linux_amd64_v${SUBWASM_VERSION}.deb"
          sudo dpkg -i subwasm.deb
          subwasm --version

      # The tag is the source of truth for what we *intend* to release; the
      # wasm knows what it *is*. Refuse to publish a mismatch.
      - name: Verify spec_version matches the tag
        run: |
          set -euo pipefail
          WASM="dist/${RUNTIME_NAME}_runtime.compact.compressed.wasm"
          EMBEDDED=$(subwasm info --json "${WASM}" | jq -r '.core_version.specVersion')
          echo "Tag says ${SPEC_VERSION}, runtime says ${EMBEDDED}"
          if [[ "${EMBEDDED}" != "${SPEC_VERSION}" ]]; then
            echo "::error::spec_version mismatch: tag ${TAG_NAME} says ${SPEC_VERSION} but the wasm embeds ${EMBEDDED}"
            exit 1
          fi

      - name: Generate release notes
        run: |
          set -euo pipefail
          WASM="dist/${RUNTIME_NAME}_runtime.compact.compressed.wasm"
          DIGEST="dist/${RUNTIME_NAME}-srtool-digest.json"
          INFO=$(subwasm info --json "${WASM}")

          PROPOSAL_HASH=$(echo "${INFO}" | jq -r '.proposal_hash')
          AUTHORIZE_UPGRADE_HASH=$(echo "${INFO}" | jq -r '.parachain_authorize_upgrade_hash')
          BLAKE2_256=$(echo "${INFO}" | jq -r '.blake2_256')
          SRTOOL_GEN=$(jq -r '.gen // "srtool"' "${DIGEST}")
          SRTOOL_RUSTC=$(jq -r '.rustc // "n/a"' "${DIGEST}")

          {
            echo "## \`${RUNTIME_NAME}\` runtime — spec_version ${SPEC_VERSION}"
            echo
            echo "Deterministic build by ${SRTOOL_GEN} (${SRTOOL_RUSTC})."
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| \`proposal_hash\` | \`${PROPOSAL_HASH}\` |"
            echo "| \`authorize_upgrade\` hash | \`${AUTHORIZE_UPGRADE_HASH}\` |"
            echo "| \`blake2_256\` | \`${BLAKE2_256}\` |"
            echo
            echo "<details><summary><code>subwasm info</code></summary>"
            echo
            echo '```'
            subwasm info "${WASM}"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "The attached srtool digest contains everything needed to reproduce this build."
          } > notes.md
          cat notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ env.RUNTIME_NAME }}_runtime.compact.compressed.wasm

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.TAG_NAME }}
          draft: true
          body_path: notes.md
          files: |
            dist/${{ env.RUNTIME_NAME }}_runtime.compact.compressed.wasm
            dist/${{ env.RUNTIME_NAME }}-srtool-digest.json
