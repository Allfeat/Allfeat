name: Deterministic Build Runtime

on:
  workflow_dispatch:
    inputs:
      runtime_name:
        description: "Name of the runtime chain (melodie)"
        required: true
        default: "melodie"
        type: string
      runtime_dir:
        description: "Path of the runtime crate (ex: runtime/melodie)"
        required: true
        default: "runtime/melodie"
        type: string
  workflow_call:
    inputs:
      runtime_name:
        required: true
        type: string
        description: "Name of the runtime chain (melodie)"
      runtime_dir:
        required: true
        type: string
        description: "Path of the runtime crate (ex: runtime/melodie)"

jobs:
  build-runtime:
    name: Build runtime (${{ inputs.runtime_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Srtool build
        id: srtool_build
        uses: chevdor/srtool-actions@v0.9.2
        env:
          BUILD_OPTS: "--features on-chain-release-build"
        with:
          chain: ${{ inputs.runtime_name }}
          runtime_dir: ${{ inputs.runtime_dir }}

      - name: Prepare artifacts
        id: prep
        run: |
          RUNTIME_NAME=${{ inputs.runtime_name }}
          RUNTIME_DIR=${{ inputs.runtime_dir }}

          WASM_PATH=$(find "${RUNTIME_DIR}/target/srtool/release/wbuild/${RUNTIME_NAME}-runtime/${RUNTIME_NAME}_runtime.compact.compressed.wasm")

          mkdir dist
          cp "$WASM_PATH" "dist/"

      # Build digest (srtool/rustc versions, hashes…) — shipped next to the
      # wasm so releases can document how to reproduce the build.
      - name: Export srtool digest
        run: |
          echo '${{ steps.srtool_build.outputs.json }}' \
            | jq . > "dist/${{ inputs.runtime_name }}-srtool-digest.json"
          cat "dist/${{ inputs.runtime_name }}-srtool-digest.json"

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.runtime_name }}-runtime
          path: dist/
