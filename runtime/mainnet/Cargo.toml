[package]
name = "allfeat-runtime"
version.workspace = true
authors.workspace = true
description = "Allfeat mainnet parachain runtime"
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[build-dependencies]
substrate-wasm-builder.workspace = true

[dependencies]
array-bytes.workspace = true
codec.workspace = true
log.workspace = true
scale-info.workspace = true
serde_json.workspace = true
smallvec.workspace = true
cumulus-pallet-parachain-system = { workspace = true }
allfeat-runtime-common = { workspace = true }

# Allfeat pallets
pallet-ats = { workspace = true }
pallet-token-allocation = { workspace = true }

# Polkadot SDK umbrella (curated features for this runtime)
polkadot-sdk = { workspace = true, features = [
    # Core Substrate primitives and runtime
    "sp-api",
    "sp-block-builder",
    "sp-consensus-aura",
    "sp-core",
    "sp-genesis-builder",
    "sp-inherents",
    "sp-io",
    "sp-keyring",
    "sp-offchain",
    "sp-runtime",
    "sp-session",
    "sp-transaction-pool",
    "sp-version",

    # FRAME core
    "frame-executive",
    "frame-support",
    "frame-system",
    "frame-metadata-hash-extension",
    "frame-system-rpc-runtime-api",

    # Pallets used in this runtime
    "pallet-aura",
    "pallet-authorship",
    "pallet-balances",
    "pallet-collator-selection",
    "pallet-message-queue",
    "pallet-session",
    "pallet-sudo",
    "pallet-timestamp",
    "pallet-transaction-payment",
    "pallet-xcm",
    "pallet-transaction-payment-rpc-runtime-api",

    # Utility & governance
    "pallet-utility",
    "pallet-multisig",
    "pallet-proxy",
    "pallet-scheduler",
    "pallet-preimage",
    "pallet-treasury",
    "pallet-meta-tx",
    "pallet-verify-signature",

    # Cumulus runtime-side pallets and primitives
    "cumulus-pallet-aura-ext",
    "cumulus-pallet-weight-reclaim",
    "cumulus-pallet-xcm",
    "cumulus-pallet-xcmp-queue",
    "cumulus-primitives-aura",
    "cumulus-primitives-core",
    "cumulus-primitives-utility",

    # Parachains and Polkadot common runtime pieces
    "parachains-common",
    "polkadot-runtime-common",
    "polkadot-parachain-primitives",
    "staging-parachain-info",

    # XCM (staging) components used at runtime
    "staging-xcm",
    "staging-xcm-builder",
    "staging-xcm-executor",
] }

[features]
default = ["std"]
std = [
    "codec/std",
    "log/std",
    "scale-info/std",
    "serde_json/std",
    "polkadot-sdk/std",
    "cumulus-pallet-parachain-system/std",
    "allfeat-runtime-common/std",
    "pallet-ats/std",
    "pallet-token-allocation/std",
]

runtime-benchmarks = [
    "cumulus-pallet-parachain-system/runtime-benchmarks",
    "polkadot-sdk/runtime-benchmarks",
    "polkadot-sdk/frame-benchmarking",
    "polkadot-sdk/frame-system-benchmarking",
    "polkadot-sdk/cumulus-pallet-session-benchmarking",
    "pallet-ats/runtime-benchmarks",
    "pallet-token-allocation/runtime-benchmarks",
]

try-runtime = [
    "cumulus-pallet-parachain-system/try-runtime",
    "polkadot-sdk/try-runtime",
    "pallet-ats/try-runtime",
    "pallet-token-allocation/try-runtime",
]

# Feature-gated because it doubles the wasm compile time.
metadata-hash = ["substrate-wasm-builder/metadata-hash"]

on-chain-release-build = ["metadata-hash"]
