[package]
name = "pallet-token-allocation"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "FRAME pallet to manage launch supply token allocations with upfront, cliff and linear vesting per envelope"
publish = false

[dependencies]
codec = { workspace = true, features = ["max-encoded-len"] }
scale-info.workspace = true
serde.workspace = true
frame = { workspace = true }

[dev-dependencies]
pallet-balances = { version = "47.0.0", default-features = false, features = ["std"] }

[features]
default = ["std"]
std = [
	"codec/std",
	"scale-info/std",
	"serde/std",
	"frame/std",
	# `frame`'s `std` pulls in its `runtime::apis` module, which only links its
	# api crates (sp-api, sp-block-builder, …) under the `runtime` feature.
	"frame/runtime",
]
runtime-benchmarks = [
	"frame/runtime-benchmarks",
]
try-runtime = [
	"frame/try-runtime",
]
